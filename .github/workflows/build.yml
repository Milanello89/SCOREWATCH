name: Preveri, ali se aplikacija zgradi

# Ta potek preveri, da se koda prevede brez napak.
# Teče na Applovem računalniku, ki ga brezplačno zagotovi GitHub –
# zato za to NE potrebuješ svojega Maca.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Gradnja za watchOS simulator
    runs-on: macos-15

    steps:
      - name: Prevzemi kodo
        uses: actions/checkout@v4

      - name: Izberi najnovejši Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Preveri, da so vse datoteke v projektu
        run: |
          xcodebuild -project ScoreWatch.xcodeproj -list

      - name: Zgradi aplikacijo
        run: |
          set -o pipefail
          xcodebuild \
            -project ScoreWatch.xcodeproj \
            -scheme ScoreWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Shrani zgrajeno aplikacijo
        uses: actions/upload-artifact@v4
        with:
          name: ScoreWatch-simulator-app
          path: build/Build/Products/Debug-watchsimulator/ScoreWatch.app
          if-no-files-found: warn
